<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kişisel Katalog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="app-header">
    <h1>Kişisel Katalog</h1>
    <p>Sevdiğin öğeleri kategorize et, puanla ve arşivle.</p>
  </header>

  <main class="container">
    
    <!-- Yeni Kayıt Ekleme Formu -->
    <section class="form-section">
      <form id="item-form" class="item-form">
        <div class="input-group">
          <input type="text" id="title" placeholder="Başlık (Örn: Dune, Limonlu Kurabiye...)" required>
          <select id="category" required>
            <option value="" disabled selected>Kategori Seç</option>
            <option value="Kitap">Kitap</option>
            <option value="Tarif">Tarif</option>
            <option value="Tasarım">Tasarım</option>
            <option value="Diğer">Diğer</option>
          </select>
          <input type="number" id="rating" min="1" max="5" placeholder="Puan (1-5)" required>
        </div>
        <textarea id="note" rows="2" placeholder="Kısa bir not veya yorum ekle..."></textarea>
        <button type="submit" class="btn-primary">Kataloğa Ekle</button>
      </form>
    </section>

    <!-- Arama ve Filtreleme Alanı -->
    <section class="controls-section">
      <input type="text" id="search-input" class="search-input" placeholder="Başlık veya notlarda ara...">
      <div class="filter-buttons" id="filter-buttons">
        <button class="filter-btn active" data-category="Tümü">Tümü</button>
        <button class="filter-btn" data-category="Kitap">Kitap</button>
        <button class="filter-btn" data-category="Tarif">
